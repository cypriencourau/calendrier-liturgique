<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Semaine liturgique</title>
    <meta name="description" content="La semaine liturgique d'un coup d'œil : fêtes, saints et couleurs." />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Liturgie" />
    <script>
      // Applique l'apparence choisie avant l'affichage (évite un flash).
      try {
        const prefs = JSON.parse(localStorage.getItem('appearance') || '{}');
        for (const [k, v] of Object.entries(prefs)) document.documentElement.dataset[k] = v;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="brand">Semaine liturgique</h1>
        <div class="topbar-actions">
          <button class="calendar-pill" id="open-settings" type="button" aria-haspopup="dialog">
            <span id="calendar-name">Philippines</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="gear-btn" id="open-appearance" type="button" aria-haspopup="dialog" aria-label="Réglages et apparence">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <nav class="week-nav" aria-label="Changer de semaine">
        <button class="nav-btn" id="prev" type="button" aria-label="Semaine précédente">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="week-title">
          <h2 id="week-range"></h2>
          <button class="today-btn" id="today" type="button" hidden>Revenir à cette semaine</button>
        </div>
        <button class="nav-btn" id="next" type="button" aria-label="Semaine suivante">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </nav>

      <section class="summary" id="summary" aria-live="polite"></section>

      <main class="days" id="days"></main>

      <footer class="footer">
        Forme ordinaire du rite romain · calendrier <span id="footer-calendar">Philippines</span>
      </footer>
    </div>

    <dialog class="sheet" id="settings">
      <form method="dialog">
        <section class="sheet-section" id="section-calendar">
          <h2>Calendrier</h2>
          <p class="sheet-hint">Les fêtes propres et les jours d'obligation dépendent du pays.</p>
          <label class="choice">
            <input type="radio" name="calendar" value="philippines" />
            <span><strong>Philippines</strong><small>Santo Niño, saints philippins, Ascension le dimanche</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="calendar" value="france" />
            <span><strong>France</strong><small>Saints de France, Ascension le jeudi</small></span>
          </label>
        </section>

        <section class="sheet-section" id="section-appearance">
          <h2>Apparence</h2>

          <fieldset class="setting">
            <legend>Thème</legend>
            <div class="segmented">
              <label><input type="radio" name="theme" value="" /><span>Auto</span></label>
              <label><input type="radio" name="theme" value="light" /><span>Clair</span></label>
              <label><input type="radio" name="theme" value="dark" /><span>Sombre</span></label>
            </div>
          </fieldset>

          <fieldset class="setting">
            <legend>Couleur principale</legend>
            <div class="accents">
              <label title="Bordeaux"><input type="radio" name="accent" value="" aria-label="Bordeaux" /><span style="--chip:#7a1f2b"></span></label>
              <label title="Bleu marial"><input type="radio" name="accent" value="marial" aria-label="Bleu marial" /><span style="--chip:#1f4e8c"></span></label>
              <label title="Vert"><input type="radio" name="accent" value="vert" aria-label="Vert" /><span style="--chip:#2e6b46"></span></label>
              <label title="Violet"><input type="radio" name="accent" value="violet" aria-label="Violet" /><span style="--chip:#5b3a8c"></span></label>
              <label title="Or"><input type="radio" name="accent" value="or" aria-label="Or" /><span style="--chip:#8a6a1c"></span></label>
              <label title="Encre"><input type="radio" name="accent" value="encre" aria-label="Encre" /><span style="--chip:#1f1b16"></span></label>
            </div>
          </fieldset>

          <fieldset class="setting">
            <legend>Taille du texte</legend>
            <div class="segmented">
              <label><input type="radio" name="size" value="petit" /><span style="font-size:0.8rem">Petit</span></label>
              <label><input type="radio" name="size" value="" /><span>Normal</span></label>
              <label><input type="radio" name="size" value="grand" /><span style="font-size:1rem">Grand</span></label>
            </div>
          </fieldset>

          <fieldset class="setting">
            <legend>Police des titres</legend>
            <div class="segmented">
              <label><input type="radio" name="font" value="" /><span class="preview-font-serif">Classique</span></label>
              <label><input type="radio" name="font" value="moderne" /><span>Moderne</span></label>
            </div>
          </fieldset>

          <fieldset class="setting">
            <legend>Densité</legend>
            <div class="segmented">
              <label><input type="radio" name="density" value="" /><span>Aérée</span></label>
              <label><input type="radio" name="density" value="compacte" /><span>Compacte</span></label>
            </div>
          </fieldset>

          <button class="reset-btn" id="reset-appearance" type="button">Revenir à l’apparence par défaut</button>
        </section>

        <button class="sheet-close" value="ok">Fermer</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
