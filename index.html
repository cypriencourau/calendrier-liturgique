<!doctype html>
<html lang="fr" data-style="lumiere">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Semaine liturgique</title>
    <meta name="description" content="La semaine liturgique d'un coup d'œil : fêtes, saints et couleurs." />
    <meta name="theme-color" content="#f3ecdc" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Liturgie" />
    <script>
      // Applique le style choisi avant l'affichage (évite un flash).
      try {
        const prefs = JSON.parse(localStorage.getItem('appearance') || '{}');
        if (prefs.style) document.documentElement.dataset.style = prefs.style;
        if (prefs.size) document.documentElement.dataset.size = prefs.size;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <p class="brand">Semaine liturgique</p>
        <div class="topbar-actions">
          <button class="pill-btn today-btn" id="today" type="button">Aujourd’hui</button>
          <button class="icon-btn" id="open-settings" type="button" aria-haspopup="dialog" aria-label="Réglages">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
          </button>
        </div>
      </header>

      <section class="week-head">
        <div class="week-title">
          <h1 id="week-range"></h1>
          <p class="season" id="season"></p>
          <p class="cycles" id="cycles"></p>
        </div>
        <div class="week-nav">
          <button class="icon-btn" id="prev" type="button" aria-label="Semaine précédente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" /></svg>
          </button>
          <button class="icon-btn" id="next" type="button" aria-label="Semaine suivante">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" /></svg>
          </button>
        </div>
      </section>

      <nav class="strip" id="strip" aria-label="Jours de la semaine"></nav>

      <main class="layout" id="content">
        <div class="col-main">
          <article class="hero" id="hero" aria-live="polite"></article>
          <section class="key" id="key"></section>
        </div>
        <section class="col-side">
          <h2 class="section-title">La semaine</h2>
          <ol class="week-list" id="week-list"></ol>
        </section>
      </main>

      <footer class="footer">Forme ordinaire du rite romain · calendrier <span id="footer-calendar">Philippines</span></footer>
    </div>

    <dialog class="sheet" id="settings">
      <form method="dialog">
        <div class="sheet-head">
          <h2>Réglages</h2>
          <button class="icon-btn" value="close" aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <section class="sheet-section" id="section-calendar">
          <h3>Calendrier</h3>
          <div class="options two">
            <label class="option">
              <input type="radio" name="calendar" value="philippines" />
              <span class="option-body"><strong>Philippines</strong><small>Santo Niño, saints philippins</small></span>
            </label>
            <label class="option">
              <input type="radio" name="calendar" value="france" />
              <span class="option-body"><strong>France</strong><small>Saints de France, Ascension le jeudi</small></span>
            </label>
          </div>
        </section>

        <section class="sheet-section" id="section-style">
          <h3>Style</h3>
          <div class="options three">
            <label class="option style-option">
              <input type="radio" name="style" value="lumiere" />
              <span class="style-preview preview-lumiere" aria-hidden="true"><i></i><b></b><b></b></span>
              <span class="option-body"><strong>Lumière</strong><small>Doux et lumineux</small></span>
            </label>
            <label class="option style-option">
              <input type="radio" name="style" value="missel" />
              <span class="style-preview preview-missel" aria-hidden="true"><i></i><b></b><b></b></span>
              <span class="option-body"><strong>Missel</strong><small>Éditorial, sobre</small></span>
            </label>
            <label class="option style-option">
              <input type="radio" name="style" value="nuit" />
              <span class="style-preview preview-nuit" aria-hidden="true"><i></i><b></b><b></b></span>
              <span class="option-body"><strong>Nuit</strong><small>Sombre, minimal</small></span>
            </label>
          </div>
        </section>

        <section class="sheet-section">
          <h3>Taille du texte</h3>
          <div class="segmented">
            <label><input type="radio" name="size" value="petit" /><span>Petite</span></label>
            <label><input type="radio" name="size" value="" /><span>Normale</span></label>
            <label><input type="radio" name="size" value="grand" /><span>Grande</span></label>
          </div>
        </section>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
